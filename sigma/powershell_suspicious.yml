title: Suspicious PowerShell Encoded Command Execution
id: 8a3f4c2e-1b5d-4e9f-a7c8-2d6e9f0b1a3c
status: experimental
description: Detects PowerShell execution with encoded command flag, a common technique for obfuscating malicious payloads.
author: Aditya Sonawane
date: 2026/09/14
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\powershell.exe'
        - Image|endswith: '\pwsh.exe'
    selection_flag:
        CommandLine|contains: '-EncodedCommand'
    condition: selection_img and selection_flag
falsepositives:
    - Legitimate administrative scripts using encoded commands
level: high